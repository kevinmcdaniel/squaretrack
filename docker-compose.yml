networks:
  squarenet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.17.0.0/24
  default:
    driver: bridge
    external: false

volumes:
  squaredb_vol:
  pgadmin_vol:
  trivy_cache:
  e2e_node_modules:

