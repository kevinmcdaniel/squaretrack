services:

  api:
    image: squareapi
    build:
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DB_SQUARETRACK_URL}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./api:/app/
    networks:
    #   - backend
      - default
      - squarenet
    ports:
      - ${API_PORT}:${API_PORT}
    container_name: square.api
    command: npm run dev
    # command: npm run dev
    depends_on:
      - db

  db:
    image: postgres:latest
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${DB_POSTGRES_NAME}
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PW}
      PGPORT: ${DB_PORT}
    command: -p ${DB_PORT}
    ports:
      - "${DB_PORT}:5432"
    container_name: square.db
    volumes:
      - squaredb_vol:/var/lib/postgresql/data
    networks:
      - default
      - squarenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u ${DB_POSTGRES_USER} -d ${DB_POSTGRES_NAME} -p 5432"]
      interval: 1m30s
      timeout: 5s
      retries: 5
      start_period: 30s

  fe:
    image: squarefe
    build:
      dockerfile: Dockerfile.fe
    environment:
      NODE_ENV: development
    env_file:
      - path: .env
        required: true
    volumes:
      - ./fe/public:/app/public
      - ./fe/src:/app/src
    networks:
      - default
      - squarenet
    ports:
      - ${FE_PORT}:3000
    container_name: square.fe
    command: npm run dev
    # command: npm run dev
    depends_on:
      - api
      - db

  studio:
    image: squareapi
    build:
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DB_SQUARETRACK_URL}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./api:/app/
    networks:
    #   - backend
      - default
      - squarenet
    ports:
      - ${STUDIO_PORT}:5555
    container_name: square.studio
    command: npx prisma studio
    # command: npm run dev
    depends_on:
      - db
      - api

networks:
  squarenet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.17.0.0/24
  default:
    driver: bridge
    external: false

volumes:
  squaredb_vol:

