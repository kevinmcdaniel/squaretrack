services:

  be:
    image: squarebe
    build:
      dockerfile: Dockerfile.be
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DB_SQUARETRACK_URL}
      PORT: ${BE_PORT_INT}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
    #   - backend
      - default
      - squarenet
    ports:
      #- ${BE_PORT}:${BE_PORT}
      - ${BE_PORT_EXT}:${BE_PORT_INT}
    container_name: square.be
    command: npm run dev
    depends_on:
      seed:
        condition: service_completed_successfully

  migrate:
    image: squarebe
    build:
      dockerfile: Dockerfile.be
    environment:
      DATABASE_URL: ${DB_SQUARETRACK_URL}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - squarenet
    container_name: square.migrate
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: squarebe
    build:
      dockerfile: Dockerfile.be
    environment:
      DATABASE_URL: ${DB_SQUARETRACK_URL}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - squarenet
    container_name: square.seed
    command: npx prisma db seed
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    # image: postgres:latest
    restart: always
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${DB_SQUARETRACK_NAME}
      POSTGRES_USER: ${DB_SQUARETRACK_USER}
      POSTGRES_PASSWORD: ${DB_SQUARETRACK_PW}
      PGPORT: ${DB_PORT_INT}
    command: -p ${DB_PORT_INT}
    ports:
      - "${DB_PORT_EXT}:${DB_PORT_INT}"
    container_name: square.db
    volumes:
      - squaredb_vol:/var/lib/postgresql/data
    networks:
      - default
      - squarenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SQUARETRACK_USER} -d ${DB_SQUARETRACK_NAME} -p ${DB_PORT_INT}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  fe:
    image: squarefe
    build:
      dockerfile: Dockerfile.fe
    environment:
      NODE_ENV: development
      PORT: ${FE_PORT_INT}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./fe/public:/app/public
      - ./fe/src:/app/src
      - ./docs:/app/docs
    networks:
      - default
      - squarenet
    ports:
      - ${FE_PORT_EXT}:${FE_PORT_INT}
    container_name: square.fe
    command: npm run dev
    depends_on:
      be:
        condition: service_started

  studio:
    image: squarestudio
    build:
      dockerfile: Dockerfile.be
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DB_SQUARETRACK_URL}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
    #   - backend
      - default
      - squarenet
    ports:
      - ${STUDIO_PORT_EXT}:${STUDIO_PORT_INT}
    container_name: square.studio
    command: npx prisma studio -p ${STUDIO_PORT_INT} -b none
    depends_on:
      seed:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [admin]
    env_file:
      - path: .env
        required: true
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PW}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT}:80"
    container_name: square.pgadmin
    volumes:
      - pgadmin_vol:/var/lib/pgadmin
    networks:
      - default
      - squarenet
    depends_on:
      db:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    profiles: [test]
    working_dir: /e2e
    env_file:
      - path: .env
        required: true
    environment:
      BASE_URL: http://square.fe:${FE_PORT_INT}
      DATABASE_URL: ${DB_SQUARETRACK_URL}
      CI: "true"
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    networks:
      - default
      - squarenet
    container_name: square.e2e
    command: sh -c "npm install && npx playwright test"
    depends_on:
      fe:
        condition: service_started

  # trivybe:
  #   image: aquasec/trivy:0.67.0
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - trivy_cache:/root/.cache/
